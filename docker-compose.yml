services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8374:8374'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gagik}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_CONFIG_PATH: ${PAYLOAD_CONFIG_PATH:-src/payload.config.ts}
      NODE_ENV: production
    restart: unless-stopped
    labels:
      - 'coolify.managed=true'
      - 'coolify.name=Gagik App'
      - 'coolify.description=Payload CMS application'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gagik}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      - 'coolify.managed=true'
      - 'coolify.name=PostgreSQL Database'
      - 'coolify.description=Database for Gagik'

volumes:
  pgdata:
  node_modules:
